volumes:
  media:
  static:
  redis_data:
  pg_data:

services:
  redis:
    image: redis:alpine
    container_name: redis
    volumes:
      - redis_data:/data
    env_file: ./.env
    networks:
      - app-network

  db:
    image: "postgres:17-alpine"
    container_name: db
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file: ./.env
    networks:
      - app-network

  backend:
    image: autoscares/autoscar_backend:latest
    container_name: backend
    env_file: ./.env
    depends_on:
      - redis
      - db
    volumes:
      - static:/backend_static
      - media:/app/media/
    networks:
      - app-network

  frontend:
    image: autoscares/autoscar_frontend:latest
    container_name: frontend
    depends_on:
      - backend
    command: cp -r /app/dist/. /static/
    volumes:
      - static:/static/
    networks:
      - app-network

  nginx:
    image: autoscares/autoscar_nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static:/staticfiles
      - media:/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
