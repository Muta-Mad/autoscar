server {
    listen 80;
    server_name localhost;
    index index.html;
    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
    }

    location /adminka/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/adminka/;
    }

    location /static/ {
        alias /staticfiles/;
    }

    location / {
        alias /staticfiles/;
        try_files $uri $uri/ /index.html;
    }

    location /media/ {
        alias /media/;
    }
}
