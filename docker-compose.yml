volumes:
  media:
  static:
  redis_data:

services:
  redis:
    image: redis:alpine
    container_name: redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
  backend:
    build: ./backend/
    container_name: backend
    env_file: ./.env
    depends_on:
      - redis
    volumes:
      - static:/backend_static
      - media:/app/media/
