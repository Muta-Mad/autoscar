volumes:
  media:
  static:
  redis_data:
  pg_data:

services:
  redis:
    image: redis:alpine
    container_name: redis
    volumes:
      - redis_data:/data
    env_file: ./.env
    networks:
      - postgres-net

  db:
    image: "postgres:17-alpine"
    container_name: db
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file: ./.env
    networks:
      - postgres-net

  backend:
    build: ./backend/
    container_name: backend
    env_file: ./.env
    depends_on:
      - redis
      - db
    volumes:
      - static:/backend_static
      - media:/app/media/
    networks:
      - postgres-net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_WHATSAPP: ${VITE_WHATSAPP:-34600000000}
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - static:/usr/share/nginx/django-static:ro
      - media:/usr/share/nginx/media:ro
    depends_on:
      - backend
    networks:
      - postgres-net

networks:
  postgres-net:
